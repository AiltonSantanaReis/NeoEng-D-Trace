[mypy]
python_version = 3.11
check_untyped_defs = True
warn_unused_configs = True
# Exclude the duplicate module file to avoid "Duplicate module named" errors
# when mypy maps file paths to module names. This excludes the older/duplicate
# `src/collision/sat2d.py`. Adjust if you prefer the other copy to be checked.
exclude = ^src/collision/sat2d.py$

# Optional: be a bit lenient during the incremental audit
ignore_missing_imports = True

# Help mypy resolve modules in projects that use `src/` as the package root
namespace_packages = True
mypy_path = src
