name: Private validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify clean baseline manifest
        run: python tools/baseline_integrity.py --verify

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Record validation environment
        run: |
          python --version
          python -m pip freeze --all

      - name: Compile Python sources
        run: python -m compileall -q -f app.py src tests pack_for_ai.py tools

      - name: Lint for fatal errors
        run: flake8 src tests tools app.py pack_for_ai.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report non-blocking lint metrics
        run: flake8 src tests tools app.py pack_for_ai.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting
        run: black --check --diff src tests tools app.py pack_for_ai.py

      - name: Check import ordering
        run: isort --check-only --diff src tests tools app.py pack_for_ai.py

      - name: Type check
        run: mypy src --ignore-missing-imports

      - name: Run tests with local coverage artifact
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Store coverage without external upload
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.11
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
