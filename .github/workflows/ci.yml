name: Private validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.4.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify clean baseline manifest
        run: python tools/baseline_integrity.py --verify --git-blob
      - name: Verify evidence manifest integrity
        run: python tools/evidence_integrity.py --require-tracked --git-blob

      - name: Refresh apt package indexes for Qt
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

      - name: Install Qt runtime libraries
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --yes --no-install-recommends libegl1

      - name: Install Poetry 2.4.1
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Verify dependency lock
        run: poetry check --lock --strict

      - name: Synchronize dependencies from lock file
        run: poetry sync --no-interaction --no-ansi

      - name: Record Linux validation environment
        run: |
          python --version
          poetry --version
          poetry run python --version
          poetry run python -m pip freeze --all > "${{ runner.temp }}/environment-freeze.txt"
          python -c "from pathlib import Path; import hashlib; raw=Path('poetry.lock').read_bytes(); text=raw.decode('utf-8'); canonical=text.replace('\r\n','\n').replace('\r','\n').encode('utf-8'); print('CANONICAL_LOCK_SHA256=' + hashlib.sha256(canonical).hexdigest())"

      - name: Compile Python sources
        run: poetry run python -m compileall -q -f app.py src tests pack_for_ai.py tools

      - name: Run full lint
        run: poetry run flake8 src tests tools app.py pack_for_ai.py

      - name: Check formatting
        run: poetry run black --check --diff src tests tools app.py pack_for_ai.py

      - name: Check import ordering
        run: poetry run isort --check-only --diff src tests tools app.py pack_for_ai.py

      - name: Type check including untyped bodies
        run: poetry run mypy src

      - name: Audit dependencies
        run: poetry run pip-audit

      - name: Scan high-severity source risks
        run: poetry run bandit -q -r src -lll

      - name: Run tests with Linux branch coverage
        run: poetry run pytest --cov=src --cov-branch --cov-fail-under=90 --cov-report=term-missing --cov-report=xml

      - name: Enforce integrated coverage policy
        run: poetry run python tools/check_coverage_policy.py coverage.xml

      - name: Run Stage 4B.5 quality audit
        run: poetry run python scripts/audit_stage4b5_quality.py --output "${{ runner.temp }}/stage4b5-quality"

      - name: Verify Linux source tree remained unchanged
        run: python tools/baseline_integrity.py --verify --git-blob

      - name: Store Linux evidence
        uses: actions/upload-artifact@v7
        with:
          name: validation-linux-python-3.11
          path: |
            coverage.xml
            ${{ runner.temp }}/environment-freeze.txt
          if-no-files-found: error
          retention-days: 30

  test-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify clean baseline manifest
        run: python tools/baseline_integrity.py --verify --git-blob
      - name: Verify evidence manifest integrity
        run: python tools/evidence_integrity.py --require-tracked --git-blob

      - name: Install Poetry 2.4.1
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Verify dependency lock
        run: poetry check --lock --strict

      - name: Synchronize dependencies from lock file
        run: poetry sync --no-interaction --no-ansi

      - name: Record Windows validation environment
        shell: pwsh
        run: |
          python --version
          poetry --version
          poetry run python --version
          poetry run python -m pip freeze --all |
            Set-Content -Path (Join-Path $env:RUNNER_TEMP "environment-freeze.txt") -Encoding utf8
          python -c "from pathlib import Path; import hashlib; raw=Path('poetry.lock').read_bytes(); text=raw.decode('utf-8'); canonical=text.replace('\r\n','\n').replace('\r','\n').encode('utf-8'); print('CANONICAL_LOCK_SHA256=' + hashlib.sha256(canonical).hexdigest())"

      - name: Compile Python sources
        run: poetry run python -m compileall -q -f app.py src tests pack_for_ai.py tools

      - name: Run full lint
        run: poetry run flake8 src tests tools app.py pack_for_ai.py

      - name: Check formatting
        run: poetry run black --check --diff src tests tools app.py pack_for_ai.py

      - name: Check import ordering
        run: poetry run isort --check-only --diff src tests tools app.py pack_for_ai.py

      - name: Type check including untyped bodies
        run: poetry run mypy src

      - name: Audit dependencies
        run: poetry run pip-audit

      - name: Scan high-severity source risks
        run: poetry run bandit -q -r src -lll

      - name: Configure Windows native crash dumps (diagnostic only)
        id: windows-native-dumps
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "native-crash-dumps"
          New-Item -ItemType Directory -Path $dumpDir -Force | Out-Null
          $dumpKey = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe"
          New-Item -Path $dumpKey -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpCount -PropertyType DWord -Value 5 -Force | Out-Null
          Write-Output "WINDOWS_NATIVE_DUMP_DIR=$dumpDir"

      - name: Run tests with Windows branch coverage
        id: windows-full-tests
        run: poetry run python tools/run_windows_coverage_shards.py --output "${{ runner.temp }}/windows-coverage"

      - name: Collect Windows native crash diagnostics
        if: ${{ failure() && steps.windows-full-tests.outcome == 'failure' }}
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "native-crash-dumps"
          if (Test-Path -LiteralPath $dumpDir) {
            Get-ChildItem -LiteralPath $dumpDir -Force |
              Select-Object FullName, Length, LastWriteTimeUtc
          } else {
            Write-Output "No Windows native dump directory was created."
          }

      - name: Enforce integrated coverage policy
        run: poetry run python tools/check_coverage_policy.py "${{ runner.temp }}/windows-coverage/coverage.xml"

      - name: Run Stage 4B.5 quality audit
        run: poetry run python scripts/audit_stage4b5_quality.py --output "${{ runner.temp }}/stage4b5-quality"

      - name: Run preserved legacy and current-contract gate
        run: poetry run python tools/run_formal_legacy_gate.py --group all --output "${{ runner.temp }}/legacy-tests"
        env:
          NEOENG_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Windows source tree remained unchanged
        run: python tools/baseline_integrity.py --verify --git-blob

      - name: Store Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-windows-python-3.11
          path: |
            ${{ runner.temp }}/environment-freeze.txt
            ${{ runner.temp }}/windows-coverage/**
            docs/evidence/**
            quality/legacy_tests/current_contract.json
            quality/legacy_tests/reconciliation.json
            ${{ runner.temp }}/legacy-tests/**
            ${{ runner.temp }}/native-crash-dumps/**
          if-no-files-found: error
          retention-days: 30
