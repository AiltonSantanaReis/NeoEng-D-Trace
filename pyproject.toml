[tool.poetry]
name = "neoeng-d-trace"
version = "0.2.0"
description = "NeoEng-D-Trace game asset preparation tool"
authors = ["NeoEng-D-Trace Maintainer <169040421+AiltonSantanaReis@users.noreply.github.com>"]
readme = "README.md"
packages = [
    { include = "src" },
]

[tool.poetry.scripts]
neoeng-d-trace = "src.launcher:main"

[tool.poetry.dependencies]
python = "^3.11"
PySide6 = "6.10.1"
numpy = "2.2.6"
opencv-python = "4.12.0.88"
Pillow = "12.0.0"
pydantic = "2.12.5"
pygltflib = "1.16.5"  # Exportação GLTF/GLB

[tool.poetry.group.dev.dependencies]
pytest = "9.0.1"
mypy = "^1.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
