[project]
name = "neoeng-d-trace"
version = "0.2.0"
description = "NeoEng-D-Trace game asset preparation tool"
authors = [
    { name = "NeoEng-D-Trace Maintainer", email = "169040421+AiltonSantanaReis@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[project.scripts]
neoeng-d-trace = "src.launcher:main"

[tool.poetry]
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
PySide6 = "6.10.1"
numpy = "2.2.6"
opencv-python = "4.12.0.88"
Pillow = "12.3.0"
pydantic = "2.12.5"
pygltflib = "1.16.5"  # Exportação GLTF/GLB

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-cov = "7.1.0"
black = "26.5.1"
isort = "8.0.1"
flake8 = "7.3.0"
mypy = "2.3.0"
pip-audit = "2.10.1"
bandit = "1.9.4"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
py_version = 311
line_length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
